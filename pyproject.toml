[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amenity-ai"
version = "0.16.0"
description = "Terminal UI to analyze and organize files using local LLMs (Ollama or any OpenAI-compatible server)."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "amenity-ai contributors"}]
dependencies = [
  "textual>=8.2,<9",
  "pypdf>=6,<7",
  "pymupdf>=1.28,<2",
  "pytesseract>=0.3,<1",
  "Pillow>=12,<13",
]

[project.urls]
Repository = "https://github.com/elmisi/amenity-ai"

[project.scripts]
amenity-ai = "archiver.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["archiver*"]

[tool.setuptools.package-data]
archiver = ["taxonomies/*.txt"]
